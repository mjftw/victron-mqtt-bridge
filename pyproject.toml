[project]
name = "victron-mqtt-bridge"
version = "0.1.0"
description = "Bridges Victron Cerbo GX MQTT telemetry to a downstream MQTT broker"
readme = "README.md"
authors = [
    { name = "Merlin Webster", email = "mjftwebster@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.46.0",
]

[project.scripts]
victron-mqtt-bridge = "victron_mqtt_bridge.main:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.13"
